[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbz-manga-translator-proto"
version = "0.5.0"
description = "Free local CBZ manga OCR and Argos translation prototype without Hugging Face"
requires-python = ">=3.10,<3.15"
dependencies = [
  "PySide6>=6.7",
  "Pillow>=10.0",
  "easyocr>=1.7.2",
  "torch>=2.2",
  "torchvision>=0.17",
  "argostranslate>=1.9.6",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ocr-extra = ["pytesseract>=0.3.13", "paddleocr>=2.8"]

[project.scripts]
cbz-manga-translator = "cbz_manga_translator.main:main"
cbz-manga-translator-server = "cbz_manga_translator.server:main"
cbz-manga-translator-argos = "cbz_manga_translator.argos_models:main"
cbz-manga-translator-analysis = "cbz_manga_translator.analysis_export:main"
cbz-manga-translator-corpus = "cbz_manga_translator.corpus_sample:main"
cbz-manga-translator-corpus-process = "cbz_manga_translator.corpus_process:main"
cbz-manga-translator-corpus-learn = "cbz_manga_translator.corpus_learn:main"
cbz-manga-translator-review-pack = "cbz_manga_translator.corpus_review_pack:main"
cbz-manga-translator-apply-review = "cbz_manga_translator.corpus_apply_review:main"
cbz-manga-translator-review-app = "cbz_manga_translator.review_app:main"
cbz-manga-translator-review-refresh = "cbz_manga_translator.review_refresh:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
